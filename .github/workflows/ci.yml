name: CI

# Cost control: macOS runners are slow and scarce, so no per-push runs. CI
# fires only on PRs (rare here; main is often committed to directly) and on
# demand via the Actions tab. Doc-only changes never spin up a runner.
# Public repo: fork PRs run with a read-only token and no secrets by default.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    # Hard stop well under the build's normal time: a hung run on a macOS
    # runner is the expensive failure mode.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SwiftPM's dependency checkout (Sparkle, DynamicNotchKit) dominates a
      # cold run; keying on Package.resolved keeps warm runs to the diff.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The release scripts are the deploy path and have no other coverage —
      # a syntax error in them would otherwise surface mid-release.
      - name: Shell-check release scripts
        run: bash -n scripts/make_app.sh scripts/make_dmg.sh
